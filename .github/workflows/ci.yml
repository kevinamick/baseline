name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Install app dependencies
        run: npm ci
      - name: Install worker dependencies
        run: npm ci --prefix worker

  lint:
    name: lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run lint

  typecheck:
    name: typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  test-app:
    name: test-app
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npx vitest run

  test-worker:
    name: test-worker
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run test --prefix worker

  build:
    name: build
    needs: install
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'Production' || 'Preview' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run build
        env:
          # Public vars baked into the client bundle at build time.
          # Stored as repo Variables (not Secrets) since they're public.
          # Defaults below let CI build for a fork PR without these set,
          # at the cost of a non-functional bundle.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ vars.NEXT_PUBLIC_CLERK_SIGN_IN_URL || '/sign-in' }}
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ vars.NEXT_PUBLIC_CLERK_SIGN_UP_URL || '/sign-up' }}
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${{ vars.NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL || '/' }}
          NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${{ vars.NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL || '/' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_placeholder' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          NEXT_PUBLIC_APP_URL: https://ci.example.com
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY || '' }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}

  e2e:
    name: e2e
    needs: install
    runs-on: ubuntu-latest
    # The Stripe test secrets below (STRIPE_PRICE_*, STRIPE_WEBHOOK_SECRET) are
    # ENVIRONMENT secrets on "Preview" — environment secrets are only injected
    # into jobs that declare the environment, so without this they'd silently
    # resolve to "" and the billing specs would fail with the price id missing.
    # Preview has no protection rules, so this never gates the per-PR e2e job.
    environment: Preview
    # Public build-time vars. Supabase points at the local stack started below;
    # the rest are non-functional placeholders so the bundle builds (these flows
    # aren't exercised by the e2e suite).
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      # One price id per paid plan. The billing e2e maps a webhook's price id
      # back to a plan slug via these (the test signs with the same value), so
      # the test and the app under test must agree. Sourced from repo secrets;
      # a fork PR without them skips the mirror test (see billing.spec.ts).
      STRIPE_PRICE_BUILDER: ${{ secrets.STRIPE_PRICE_BUILDER }}
      STRIPE_PRICE_SCALE: ${{ secrets.STRIPE_PRICE_SCALE }}
      # The billing e2e signs a webhook with this and the app verifies against it.
      # Sourced from the repo secret (also set in .env.local); a fork PR without it
      # skips the mirror test (see billing.spec.ts), so CI stays green either way.
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
      # The Playwright web server runs the *production* bundle (`npm run start`),
      # so app-side mail (billing limits, invites) would otherwise route to Resend
      # — which has no API key here. Force the local Mailpit SMTP sink so the
      # notification specs can assert on delivered mail. See src/lib/email/send.ts.
      EMAIL_TRANSPORT: smtp
      # The auth/email surfaces are rate-limited in prod (ADR-0010), but the e2e
      # suite drives those flows hard (repeated sign-in/reset) against the
      # *production* bundle — so the limiter is turned off here. Explicit env var,
      # never NODE_ENV-keyed (the bundle's NODE_ENV is `production` either way).
      RATE_LIMIT_ENABLED: "false"
      # Temporal is the sole eval-run executor (#123, ADR-0006): createEvalRun starts a
      # `runEvalWorkflow` through the Temporal client, so the app-under-test must be able to
      # reach a Temporal server. The e2e job runs a headless dev server below (no worker — the
      # interactive-run specs assert app-side side effects like the managed reserve / points
      # rows, then the run sits queued in Temporal; `workflow.start` returns without a worker).
      # TEMPORAL_ADDRESS defaults to localhost:7233 (the dev server's default). The key is a
      # throwaway CI value — nothing decrypts it here (no worker), it only satisfies the codec.
      TEMPORAL_ENCRYPTION_KEY: INWX/3SgQtxONdG8Mde9plFqGetp19jYLocX/qA0IGY=
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # @supabase/supabase-js (used by the seed and the app's admin client) requires
      # a global WebSocket, which only exists from Node 22 — so the seed and the
      # server-under-test both need it. Overrides the Node 20 from the setup action
      # for this job only; node_modules are pure-JS and restore fine across versions.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase credentials
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # Append-only ledger GRANT guard (ADR-0009). The plain `test-app` job runs
      # `vitest run` with no Supabase env, so the *.integration.test.ts append-only
      # checks self-skip there — which is exactly how the 20260614 bulk-grant
      # regression slipped through. Run them HERE, where a real local Supabase
      # exists, BEFORE seeding so they assert against the bare migration state and
      # don't depend on (or perturb) the e2e fixtures.
      - name: Verify append-only ledger grants
        run: npx vitest run append-only-grants.integration

      # Temporal is mandatory for eval-run creation (#123). Start a headless dev server (no Web
      # UI) so the interactive-run specs' createEvalRun can start its workflow. No worker is
      # registered — the workflow just sits queued, matching the old pgmq-queued behavior these
      # specs assert against (they check app-side reserve/points side effects, not execution).
      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      - name: Start Temporal dev server
        run: |
          temporal server start-dev --headless --log-level error &
          # Wait until the frontend gRPC port accepts connections before the suite runs.
          for i in $(seq 1 30); do
            if temporal operator cluster health >/dev/null 2>&1; then
              echo "Temporal dev server is ready"; exit 0
            fi
            sleep 1
          done
          echo "Temporal dev server did not become ready in time" >&2
          exit 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Seed test fixtures (Team A/B + Readonly Member)
        run: SEED_ENV=development node scripts/seed-e2e.mjs

      - name: Build app
        run: npm run build

      - name: Run Playwright
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  migrate-prod:
    name: migrate-prod
    needs: [lint, typecheck, test-app, test-worker, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID_PROD }}"
          supabase db push
