name: ci

on:
  pull_request:
    # feature/** as a PR base gives stacked slice PRs the same gate as develop
    # PRs; deploy/migrate jobs stay guarded by their push-to-main conditions.
    branches: [develop, main, "feature/**"]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs and the develop branch to free runners, but
  # NEVER cancel a push to main mid-flight: that run owns migrate-prod, and
  # aborting a schema push partway through is dangerous.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Install app dependencies
        run: npm ci
      - name: Install worker dependencies
        run: npm ci --prefix worker

  lint:
    name: lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run lint

  typecheck:
    name: typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm run typecheck --prefix worker

  test-app:
    name: test-app
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npx vitest run

  test-worker:
    name: test-worker
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run test --prefix worker

  build:
    name: build
    needs: install
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'Production' || 'Preview' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Cache Next.js build cache
        uses: actions/cache@v5
        with:
          # Next's compiler cache (Turbopack persistent cache in Next 16). A
          # fresh key per commit always saves; restore-keys pulls the most
          # recent prior cache so incremental builds skip unchanged work.
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
        env:
          # Public vars baked into the client bundle at build time.
          # Stored as repo Variables (not Secrets) since they're public.
          # Defaults below let CI build for a fork PR without these set,
          # at the cost of a non-functional bundle.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}
          NEXT_PUBLIC_APP_URL: https://ci.example.com
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY || '' }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}

  e2e:
    name: e2e
    needs: install
    runs-on: ubuntu-latest
    # Public build-time vars. Supabase points at the local stack started below;
    # the rest are non-functional placeholders so the bundle builds (these flows
    # aren't exercised by the e2e suite).
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
      # The Playwright web server runs the *production* bundle (`npm run start`).
      # Force the local Mailpit SMTP sink so notification specs can assert on mail.
      EMAIL_TRANSPORT: smtp
      # Temporal is the sole eval-run executor (#123, ADR-0006): createEvalRun starts a
      # `runEvalWorkflow` through the Temporal client, so the app-under-test must be able to
      # reach a Temporal server. The e2e job runs a headless dev server below (no worker — the
      # interactive-run specs assert app-side side effects, then the run sits queued in
      # Temporal; `workflow.start` returns without a worker).
      # TEMPORAL_ADDRESS defaults to localhost:7233 (the dev server's default). The key is a
      # throwaway CI value — nothing decrypts it here (no worker), it only satisfies the codec.
      TEMPORAL_ENCRYPTION_KEY: INWX/3SgQtxONdG8Mde9plFqGetp19jYLocX/qA0IGY=
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # @supabase/supabase-js (used by the seed and the app's admin client) requires
      # a global WebSocket, which only exists from Node 22 — so the seed and the
      # server-under-test both need it. Overrides the Node 20 from the setup action
      # for this job only; node_modules are pure-JS and restore fine across versions.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase credentials
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # Temporal is mandatory for eval-run creation (#123). Start a headless dev server (no Web
      # UI) so the interactive-run specs' createEvalRun can start its workflow. No worker is
      # registered — the workflow just sits queued, matching the old pgmq-queued behavior these
      # specs assert against (they check app-side reserve/points side effects, not execution).
      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      - name: Start Temporal dev server
        run: |
          temporal server start-dev --headless --log-level error &
          # Wait until the frontend gRPC port accepts connections before the suite runs.
          for i in $(seq 1 30); do
            if temporal operator cluster health >/dev/null 2>&1; then
              echo "Temporal dev server is ready"; exit 0
            fi
            sleep 1
          done
          echo "Temporal dev server did not become ready in time" >&2
          exit 1

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          # Browser binaries live here; they're pinned to the installed
          # @playwright/test version, so key on the lockfile hash.
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        # On a cache hit the browser binaries are already restored, so only the
        # OS-level shared libraries (apt) need installing; on a miss, fetch both.
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Seed the Local Workspace fixtures
        run: SEED_ENV=development node scripts/seed-e2e.mjs

      - name: Cache Next.js build cache
        uses: actions/cache@v5
        with:
          # Shares the build job's key prefix so the two build steps warm one
          # another's Next compiler cache across runs.
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build app
        run: npm run build

      - name: Run Playwright
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        # Only keep the report when the run actually failed — a passing run's
        # report is never looked at, and uploading one per push filled the
        # Actions storage quota. Combined with the 7-day retention below.
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
