# fly.toml app configuration file generated for baseline-7e62lg on 2026-05-27T04:09:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'baseline-7e62lg'
primary_region = 'iad'

[build]

[deploy]
  strategy = 'immediate'

[http_service]
  internal_port = 8080
  force_https = true
  # Always-on: this worker long-polls Temporal's task queues (pull-based). Nothing external can
  # wake a stopped worker, so scaling to zero would silently stall every Temporal-driven workflow.
  # Keep one machine running at all times and never auto-stop it. See ADR-0006. Do NOT re-enable
  # scale-to-zero here without first retiring the Temporal worker.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
