app = "baseline-eval-worker"
primary_region = "iad"

[build]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[deploy]
  strategy = "immediate"

# No HTTP service — this is a background worker only.
# Scale to 0 when idle; Fly will restart the machine when new queue messages arrive
# via a scheduled ping or manual trigger.
[checks]
  [checks.alive]
    type = "tcp"
    port = 8080
    interval = "30s"
    timeout = "5s"
